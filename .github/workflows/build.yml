name: Build and Release

on:
  push:
    branches:
      - "26.2"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        java: [ 25 ]
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin' 

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/loom-cache
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Build
        run: ./gradlew build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4.4.0
        with:
          name: Artifacts
          path: |
            xplat/build/libs/
            fabric/build/libs/
            neoforge/build/libs/ 

      - name: Create Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.run_number }}
          name: build+${{ github.run_number }}
          files: |
            xplat/build/libs/*
            fabric/build/libs/*
            neoforge/build/libs/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: publish fabric
        uses: apehum/mc-publish@v1.2
        with:
          curseforge-id: 1544558
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          name: build+${{ github.run_number }}
          version-type: alpha
          game-versions: 26.2
          changelog: ${{ github.event.head_commit.message }}
          loaders: fabric
          files-primary: fabric/build/libs/*+fabric.jar
          files-secondary: fabric/build/libs/!(*filtered*)-@(api|sources).jar

      - name: publish neo
        uses: apehum/mc-publish@v1.2
        with:
          curseforge-id: 1544558
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          name: build+${{ github.run_number }}
          version-type: alpha
          game-versions: 26.2
          changelog: ${{ github.event.head_commit.message }}
          loaders: neoforge
          files-primary: neoforge/build/libs/*+neoforge.jar
          files-secondary: neoforge/build/libs/!(*filtered*)-@(api|sources).jar
